<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Brand master 「伴星」 (companion star): FINAL flat application artwork.
       In-product line icons remain currentColor-only; the gradient lives only here. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="0.55" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#dbeafe"/>
      <stop offset="1" stop-color="#93c5fd"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="1024" rx="228" fill="url(#bg)"/>
  <circle cx="512" cy="512" r="252" fill="none" stroke="#ffffff" stroke-opacity="0.9" stroke-width="34"/>
  <circle cx="512" cy="512" r="66" fill="url(#glow)"/>
  <circle cx="764" cy="512" r="52" fill="#ffffff"/>
  <circle cx="764" cy="512" r="88" fill="#ffffff" fill-opacity="0.18"/>
</svg>
